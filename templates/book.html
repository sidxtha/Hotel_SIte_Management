{% extends "base.html" %}
{% block title %}Book a Room - Friendship Hotel{% endblock %}
{% block extra_css %}
<style>
  .booking-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
  }
  .room-gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .room-card {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .room-card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .room-card:hover img {
    transform: scale(1.03);
  }
  .room-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(90, 24, 24, 0.85);
    color: white;
    font-size: 0.85rem;
    padding: 0.4rem;
    text-align: center;
    font-weight: 500;
  }
  /* Specific placement configuration */
  .room-suite {
    grid-column: span 2;
  }
  .room-suite img {
    height: 200px;
  }
  @media (max-width: 900px) {
    .booking-layout {
      grid-template-columns: 1fr;
    }
  }
</style>
{% endblock %}

{% block content %}
<section class="page-section">
    <h1>Book a Room</h1>

    <div class="booking-layout">
        <!-- Left Side: Booking Form -->
        <div class="order-details-box" style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow-sm);">
            <form method="POST">
                <div class="form-group" style="margin-bottom: 1rem; display: flex; flex-direction: column;">
                    <label for="name" style="margin-bottom: 0.3rem; font-weight: 500;">Full Name</label>
                    <input type="text" id="name" name="name" required style="padding: 0.5rem; border: 1px solid var(--color-border); border-radius: 4px;">
                </div>
                
                <div class="form-group" style="margin-bottom: 1rem; display: flex; flex-direction: column;">
                    <label for="email" style="margin-bottom: 0.3rem; font-weight: 500;">Email</label>
                    <input type="email" id="email" name="email" required style="padding: 0.5rem; border: 1px solid var(--color-border); border-radius: 4px;">
                </div>
                
                <div class="form-group" style="margin-bottom: 1rem; display: flex; flex-direction: column;">
                    <label for="check_in" style="margin-bottom: 0.3rem; font-weight: 500;">Check-in Date</label>
                    <input type="date" id="check_in" name="check_in" required style="padding: 0.5rem; border: 1px solid var(--color-border); border-radius: 4px;">
                </div>
                
                <div class="form-group" style="margin-bottom: 1rem; display: flex; flex-direction: column;">
                    <label for="check_out" style="margin-bottom: 0.3rem; font-weight: 500;">Check-out Date</label>
                    <input type="date" id="check_out" name="check_out" required style="padding: 0.5rem; border: 1px solid var(--color-border); border-radius: 4px;">
                </div>
                
                <div class="form-group" style="margin-bottom: 1rem; display: flex; flex-direction: column;">
                    <label for="room_type" style="margin-bottom: 0.3rem; font-weight: 500;">Room Type</label>
                    <select id="room_type" name="room_type" style="padding: 0.5rem; border: 1px solid var(--color-border); border-radius: 4px;">
                        <option value="Standard">Standard</option>
                        <option value="Deluxe">Deluxe</option>
                        <option value="Suite">Suite</option>
                    </select>
                </div>
                
                <div class="form-group" style="margin-bottom: 1.5rem; display: flex; flex-direction: column;">
                    <label for="guests" style="margin-bottom: 0.3rem; font-weight: 500;">Number of Guests</label>
                    <input type="number" id="guests" name="guests" min="1" value="1" required style="padding: 0.5rem; border: 1px solid var(--color-border); border-radius: 4px;">
                </div>
                
                <button type="submit" class="btn-order" style="background-color: #5a1818; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 4px; cursor: pointer; width: 100%;">Confirm Booking</button>
            </form>
        </div>

        <!-- Right Side: Room Showcase Gallery -->
        <div class="room-gallery">
            <!-- Top Right: Standard Room -->
            <div class="room-card">
                <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=600&q=80" alt="Standard Room">
                <div class="room-label">Standard Room</div>
            </div>
            
            <!-- Middle Right / Left Middle: Deluxe Room -->
            <div class="room-card">
                <img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=600&q=80" alt="Deluxe Room">
                <div class="room-label">Deluxe Room</div>
            </div>

            <!-- Right Bottom: Suite Room (Span across both columns) -->
            <div class="room-card room-suite">
                <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=800&q=80" alt="Luxury Suite">
                <div class="room-label">Executive Suite</div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
